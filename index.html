<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phong Work</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#7fa4d0;--bg2:#b7cbe2;--card:#fbfbfa;--ink:#17181b;--muted:#8b8e95;--line:#e8e8e5;--video:#5b8def;--design:#a477e8;--post:#58b88a;--feedback:#f2a65a;--danger:#ff5b57;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 18px 50px rgba(41,61,87,.11)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg) 0 48%,var(--bg2) 48% 76%,#d7e2ef 76%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,transparent 0 28%,rgba(255,255,255,.14) 28% 46%,transparent 46%)}button,input{font:inherit}.app{position:relative;z-index:1;width:min(1120px,calc(100% - 36px));margin:auto;padding:30px 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:15px}.logo{font-size:15px;font-weight:800;letter-spacing:.06em}.autosave{font-size:11px;opacity:.86}.card{background:rgba(251,251,250,.98);border:1px solid rgba(255,255,255,.72);border-radius:20px;box-shadow:var(--shadow)}
.summary{padding:23px 25px;display:grid;grid-template-columns:1fr minmax(280px,360px);gap:28px;align-items:center}.label{font-size:10px;color:var(--danger);font-weight:800;letter-spacing:.1em}.dateBig{font-size:29px;font-weight:650;letter-spacing:-1.1px;margin-top:5px}.small{font-size:10.5px;color:var(--muted);margin-top:5px}
.progressLine{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.progressLine strong{font-size:27px;letter-spacing:-1px}.progressLine span{font-size:10px;color:var(--muted)}.track{height:12px;background:#ececeb;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--video),var(--design),var(--post));border-radius:99px;transition:width .8s var(--ease)}
.monthCard{margin-top:15px;padding:23px 25px 19px}.head,.tasksHead{display:flex;justify-content:space-between;align-items:end}.head h2,.tasksHead h2{margin:0;font-size:17px}.total{text-align:right}.total strong{font-size:27px}.total span{display:block;font-size:9px;color:var(--muted)}.chartWrap{height:245px;margin-top:14px}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.legendItem{background:#f2f2f0;border-radius:11px;padding:10px 11px;cursor:pointer;transition:.2s}.legendItem:hover{transform:translateY(-2px)}.legendItem b{font-size:16px}.legendItem span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.legendItem i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.tasksCard{margin-top:15px;padding:20px 22px 10px}.add{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:750;cursor:pointer;transition:.22s}.add:hover{transform:translateY(-1px)}.tabs{display:flex;gap:4px;background:#f0f0ee;padding:4px;border-radius:12px;margin:16px 0 11px;width:max-content}.tab{border:0;background:transparent;padding:8px 13px;border-radius:9px;color:#777;font-size:11px;cursor:pointer}.tab.active{background:#fff;color:#222;box-shadow:0 3px 10px rgba(0,0,0,.06);font-weight:700}
.controls{display:grid;grid-template-columns:1fr 150px 140px;gap:8px;margin-bottom:10px}.search{border:0;background:#f0f0ee;border-radius:10px;padding:10px 12px;outline:none;color:#333}.search:focus{background:#fff;box-shadow:0 0 0 3px rgba(91,141,239,.12)}
.monthPicker{position:relative}.monthBtn,.filterBtn{width:100%;height:38px;border:0;border-radius:10px;padding:0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s var(--ease)}
.monthBtn{background:#edf3fb;color:#47698f}.monthBtn:hover{background:#e4eef9}.categoryFilter{background:#eee8f8;color:#75579b}.categoryFilter:hover{background:#e7def5}
.chev{font-size:13px;opacity:.7;transition:transform .18s}.monthPicker.open .chev,.filter.open .chev{transform:rotate(180deg)}
.monthMenu{position:absolute;right:0;top:44px;width:230px;background:#fff;border-radius:12px;padding:7px;box-shadow:0 18px 50px rgba(0,0,0,.14);opacity:0;transform:translateY(-5px) scale(.98);pointer-events:none;transition:.18s var(--ease);z-index:9}
.monthPicker.open .monthMenu{opacity:1;transform:none;pointer-events:auto}
.monthMenuHead{display:flex;justify-content:space-between;align-items:center;padding:6px 5px 9px}.monthMenuHead strong{font-size:11px}.monthMenuHead button{border:0;background:#f1f1ef;width:28px;height:28px;border-radius:8px;cursor:pointer}
.monthGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.monthGrid button{border:0;background:#f5f5f3;border-radius:8px;padding:9px 5px;font-size:10px;cursor:pointer}.monthGrid button:hover{background:#edf3fb}.monthGrid button.selected{background:#5b8def;color:#fff;font-weight:700}
.monthAll{width:100%;border:0;background:transparent;color:#5b8def;text-align:left;padding:9px 7px 5px;font-size:10px;font-weight:700;cursor:pointer}
.filter{position:relative}.menu{position:absolute;right:0;top:44px;width:180px;background:#fff;border-radius:12px;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.14);opacity:0;transform:translateY(-5px) scale(.98);pointer-events:none;transition:.18s var(--ease);z-index:8}.menu.open{opacity:1;transform:none;pointer-events:auto}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px;cursor:pointer}.menu button:hover{background:#f3f3f1}
.groupHead{display:flex;justify-content:space-between;align-items:center;padding:14px 5px 7px}.groupHead strong{font-size:11px}.groupHead span{font-size:9px;color:var(--muted)}.task{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto 32px;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);animation:rise .38s var(--ease) both;transition:.22s;cursor:pointer}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.task:hover{background:#f6f6f4;border-radius:11px;padding-left:9px;padding-right:9px}
.check{appearance:none;width:21px;height:21px;border:1.6px solid #c7c7c4;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:.22s;z-index:2}.check:checked{background:var(--post);border-color:var(--post);animation:pop .35s var(--ease)}.check:checked:after{content:"✓";color:#fff;font-size:12px;font-weight:800}@keyframes pop{50%{transform:scale(1.2)}}.taskTitle{font-size:12.5px;font-weight:650}.taskNote{font-size:10px;color:var(--muted);margin-top:4px}.done{opacity:.54}.done .taskTitle{text-decoration:line-through}.cat{font-size:9.5px;display:flex;gap:6px;align-items:center;color:#666;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%}.meta{font-size:9.5px;color:var(--muted);white-space:nowrap}.overdue{color:var(--danger);font-weight:750}.more{border:0;background:transparent;font-size:18px;color:#aaa;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:38px;font-size:11px}
.overlay{position:fixed;inset:0;background:rgba(36,46,58,.22);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:30;padding:20px;opacity:0;pointer-events:none;transition:.28s}.overlay.show{opacity:1;pointer-events:auto}.modal{width:min(500px,100%);background:#fbfbfa;border-radius:20px;padding:25px;box-shadow:0 35px 100px rgba(0,0,0,.2);transform:translateY(16px) scale(.98);transition:.3s var(--ease)}.show .modal{transform:none}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal h3{margin:0;font-size:19px}.delete{border:0;background:#ffe9e7;color:var(--danger);border-radius:9px;padding:8px 10px;font-size:10px;font-weight:700;cursor:pointer}.fields{display:grid;gap:10px}.fields input{border:0;background:#efefef;border-radius:10px;padding:12px 14px;outline:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{--c:#777;--soft:#eee;border:2px solid transparent;background:#efefef;border-radius:10px;padding:11px;text-align:left;cursor:pointer;transition:.2s}.choice.active{border-color:var(--c);background:var(--soft);color:var(--c);font-weight:750}.choice.video{--c:var(--video);--soft:#eaf1ff}.choice.design{--c:var(--design);--soft:#f1eaff}.choice.post{--c:var(--post);--soft:#e9f6ef}.choice.feedback{--c:var(--feedback);--soft:#fff2e2}
.datePicker{position:relative}.dateField{width:100%;border:0;background:#efefef;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;cursor:pointer}.calendarPopup{position:absolute;left:0;top:49px;width:286px;background:#fff;border:1px solid #e7e7e4;border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.15);z-index:40;opacity:0;transform:translateY(-5px) scale(.98);pointer-events:none;transition:.18s}.calendarPopup.open{opacity:1;transform:none;pointer-events:auto}.calNav{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;margin-bottom:9px}.calNav strong{text-align:center;font-size:11px}.calNav button,.calFoot button{border:0;background:transparent;cursor:pointer}.calNav button{font-size:19px}.calWeek,.calDays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.calWeek{font-size:8px;color:#999;margin-bottom:4px}.calDays button{height:31px;border:0;background:transparent;border-radius:7px;cursor:pointer;font-size:10px}.calDays button:hover{background:#f1f3f7}.calDays .dim{color:#c1c2c6}.calDays .selected{background:#222;color:#fff}.calDays .today:not(.selected){box-shadow:inset 0 0 0 1px #b8bbc2}.calFoot{text-align:right;border-top:1px solid #eee;margin-top:7px;padding-top:7px}.calFoot button{font-size:9px;color:var(--video);font-weight:700}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.cancel{border:0;background:#ececea;border-radius:999px;padding:10px 14px;cursor:pointer}.saveBtn{border:0;background:var(--video);color:#fff;border-radius:999px;padding:10px 16px;font-weight:750;cursor:pointer}
@media(max-width:700px){
 body{background:linear-gradient(160deg,#7fa4d0 0 22%,#b7cbe2 22% 48%,#d7e2ef 48%)}.app{width:100%;padding:18px 12px 90px}.top{padding:0 4px}.summary{grid-template-columns:1fr;padding:18px;gap:17px}.dateBig{font-size:24px}.progressLine strong{font-size:23px}.monthCard{padding:18px 14px}.chartWrap{height:210px;margin-top:8px}.legend{grid-template-columns:1fr 1fr}.legendItem{padding:9px}.tasksCard{padding:17px 13px 8px}.tasksHead{align-items:center}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:9px 5px}.controls{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.monthPicker{min-width:0;width:100%}.monthMenu{left:0;right:auto;width:min(270px,calc(100vw - 26px))}.task{grid-template-columns:31px minmax(0,1fr) 29px;padding:13px 3px}.task .cat,.task .meta{display:none}.taskTitle{font-size:13px}.taskNote{font-size:10px}.more{opacity:1}.modal{position:absolute;left:0;right:0;bottom:0;width:100%;max-width:none;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);max-height:92vh;overflow:auto}.show .modal{transform:translateY(0)}.overlay{padding:0;align-items:end}.calendarPopup{position:fixed;left:12px;right:12px;top:auto;bottom:210px;width:auto}.choices{grid-template-columns:1fr 1fr}.add{padding:10px 13px}.head{align-items:center}.total strong{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div class="logo">PHONG WORK</div><div class="autosave" id="saveState">● Auto saved</div></div>
 <section class="card summary"><div><div class="label">TODAY</div><div class="dateBig" id="dateText"></div><div class="small" id="todayText"></div></div><div><div class="progressLine"><span>Daily progress</span><strong id="todayPct">0%</strong></div><div class="track"><div class="fill" id="todayFill"></div></div></div></section>
 <section class="card monthCard"><div class="head"><div><h2>Monthly output</h2><div class="small" id="monthText"></div></div><div class="total"><strong id="monthTotal">0</strong><span>COMPLETED TASKS</span></div></div><div class="chartWrap"><canvas id="chart"></canvas></div><div class="legend" id="legend"></div></section>
 <section class="card tasksCard">
  <div class="tasksHead"><div><h2>Tasks</h2><div class="small">Xem, sửa và quản lý toàn bộ công việc.</div></div><button class="add" onclick="openModal()">＋ Add task</button></div>
  <div class="tabs"><button class="tab active" data-mode="today" onclick="setMode(this)">Today</button><button class="tab" data-mode="all" onclick="setMode(this)">All Tasks</button><button class="tab" data-mode="done" onclick="setMode(this)">Completed</button></div>
  <div class="controls"><input class="search" id="search" placeholder="Tìm công việc..." oninput="renderTasks()"><div class="monthPicker">
      <button class="monthBtn" id="monthBtn" type="button" onclick="toggleMonthMenu(event)">
        <span id="monthFilterText">Tất cả tháng</span>
      </button>
      <div class="monthMenu" id="monthMenu"></div>
    </div><div class="filter"><button class="filterBtn categoryFilter" id="categoryFilterBtn" onclick="toggleMenu()"><span id="filterText">Tất cả</span></button><div class="menu" id="menu"><button onclick="chooseFilter('',this)">Tất cả</button><button onclick="chooseFilter('Edit Video',this)">Edit Video</button><button onclick="chooseFilter('Design',this)">Design</button><button onclick="chooseFilter('Đăng Bài',this)">Đăng Bài</button><button onclick="chooseFilter('Feedback',this)">Feedback</button></div></div></div>
  <div id="tasks"></div>
 </section>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
 <div class="modalHead"><h3 id="modalTitle">Thêm công việc</h3><button class="delete" id="deleteBtn" onclick="deleteEditing()" style="display:none">Xóa task</button></div>
 <div class="fields"><input id="name" placeholder="Tên công việc"><div class="datePicker"><button type="button" class="dateField" onclick="toggleCalendar(event)"><span id="dateDisplay"></span><span>▣</span></button><div class="calendarPopup" id="calendarPopup"><div class="calNav"><button onclick="changeMonth(-1)">‹</button><strong id="calMonth"></strong><button onclick="changeMonth(1)">›</button></div><div class="calWeek"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div><div class="calDays" id="calDays"></div><div class="calFoot"><button onclick="pickDate(TODAY)">Hôm nay</button></div></div></div><input id="note" placeholder="Brand / ghi chú">
 <div class="choices"><button class="choice video active" data-cat="Edit Video" onclick="chooseCat(this)">Edit Video</button><button class="choice design" data-cat="Design" onclick="chooseCat(this)">Design</button><button class="choice post" data-cat="Đăng Bài" onclick="chooseCat(this)">Đăng Bài</button><button class="choice feedback" data-cat="Feedback" onclick="chooseCat(this)">Feedback</button></div></div>
 <div class="actions"><button class="cancel" onclick="closeModal()">Hủy</button><button class="saveBtn" id="saveBtn" onclick="saveTask()">Thêm task</button></div>
</div></div>
<script>
Chart.register(ChartDataLabels);
const $=s=>document.querySelector(s),KEY='phong-work-v6',COLORS={'Edit Video':'#5b8def','Design':'#a477e8','Đăng Bài':'#58b88a','Feedback':'#f2a65a'};
const iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},TODAY=iso(new Date()),shift=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const SUPABASE_URL='https://ojjzdhkdmvgegdvlvmrm.supabase.co';
const SUPABASE_KEY='sb_publishable_JoCupAY95g3R_SylOnu2JA_h0405dY_';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let tasks=[];
let mode='today',filter='',monthFilter='',monthMenuYear=new Date().getFullYear(),selectedCat='Edit Video',selectedDate=TODAY,calendarCursor=new Date(),editingId=null,chart;
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setSaveState(t){$('#saveState').textContent=t}
async function loadTasks(){
 setSaveState('● Syncing...');
 const {data,error}=await db.from('tasks').select('*').order('task_date',{ascending:true});
 if(error){setSaveState('● Sync error');console.error(error);return}
 tasks=(data||[]).map(r=>({id:r.id,name:r.name,date:r.task_date,cat:r.category,note:r.note||'',done:r.done}));
 setSaveState('● Synced');renderTasks()
}
function dateLabel(v){return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v+'T00:00:00'))}
function setMode(el){mode=el.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderTasks()}
function currentMonthDone(){let n=new Date(),y=n.getFullYear(),m=n.getMonth();return tasks.filter(t=>{let d=new Date(t.date+'T00:00:00');return t.done&&d.getFullYear()===y&&d.getMonth()===m})}
function updateDashboard(){let a=tasks.filter(t=>t.date===TODAY),d=a.filter(t=>t.done).length,p=a.length?Math.round(d/a.length*100):0;$('#todayText').textContent=`${d} / ${a.length} tasks completed`;$('#todayPct').textContent=p+'%';requestAnimationFrame(()=>$('#todayFill').style.width=p+'%');
 let cats=Object.keys(COLORS),month=currentMonthDone(),counts=cats.map(c=>month.filter(t=>t.cat===c).length);$('#monthTotal').textContent=month.length;$('#legend').innerHTML=cats.map((c,i)=>`<div class="legendItem" onclick="quickFilter('${c}')"><b>${counts[i]}</b><span><i style="background:${COLORS[c]}"></i>${c}</span></div>`).join('');
 if(chart)chart.destroy();chart=new Chart($('#chart'),{type:'bar',data:{labels:cats,datasets:[{data:counts,backgroundColor:cats.map(c=>COLORS[c]),borderRadius:10,borderSkipped:false,maxBarThickness:70}]},options:{animation:{duration:650,easing:'easeOutQuart'},layout:{padding:{top:24}},responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},datalabels:{anchor:'end',align:'top',color:'#303238',font:{size:12,weight:'700'},formatter:v=>v},tooltip:{displayColors:false,callbacks:{label:c=>c.raw+' tasks'}}},scales:{y:{beginAtZero:true,ticks:{precision:0,color:'#999',font:{size:9}},grid:{color:'#ededeb'},border:{display:false}},x:{ticks:{color:'#666',font:{size:9,weight:'600'}},grid:{display:false},border:{display:false}}}}})}
function filtered(){let q=$('#search').value.toLowerCase(),mon=monthFilter;return tasks.filter(t=>{let scope=mode==='today'?t.date===TODAY:mode==='done'?t.done:true;return scope&&(!filter||t.cat===filter)&&(!mon||t.date.startsWith(mon))&&t.name.toLowerCase().includes(q)}).sort((a,b)=>a.date.localeCompare(b.date)||a.done-b.done)}
function renderTasks(){let a=filtered(),groups={};a.forEach(t=>(groups[t.date]??=[]).push(t));$('#tasks').innerHTML=a.length?Object.entries(groups).map(([date,items])=>`<div class="groupHead"><strong>${date===TODAY?'Hôm nay':dateLabel(date)}</strong><span>${items.filter(x=>x.done).length}/${items.length} done</span></div>`+items.map((t,i)=>`<div class="task ${t.done?'done':''}" style="animation-delay:${i*25}ms" onclick="editTask(${t.id})"><input class="check" type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation()" onchange="toggle(${t.id})"><div><div class="taskTitle">${esc(t.name)}</div><div class="taskNote">${esc(t.note)}</div></div><div class="cat"><span class="dot" style="background:${COLORS[t.cat]}"></span>${esc(t.cat)}</div><div class="meta ${!t.done&&t.date<TODAY?'overdue':''}">${!t.done&&t.date<TODAY?'OVERDUE · ':''}${dateLabel(t.date)}</div><button class="more" onclick="event.stopPropagation();editTask(${t.id})">⋯</button></div>`).join('')).join(''):'<div class="empty">Không có task phù hợp.</div>';updateDashboard()}
async function toggle(id){
 let t=tasks.find(x=>x.id===id),next=!t.done;t.done=next;renderTasks();setSaveState('● Saving...');
 const {error}=await db.from('tasks').update({done:next}).eq('id',id);
 if(error){t.done=!next;console.error(error);setSaveState('● Sync error');renderTasks()}else setSaveState('● Synced')
}
function quickFilter(c){mode='all';filter=c;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode==='all'));$('#filterText').textContent=c;$('#categoryFilterBtn').style.background=COLORS[c]+'22';$('#categoryFilterBtn').style.color=COLORS[c];renderTasks();document.querySelector('.tasksCard').scrollIntoView({behavior:'smooth'})}
function toggleMenu(){document.querySelector('.filter').classList.toggle('open');$('#menu').classList.toggle('open')}
function chooseFilter(v,el){
 filter=v;$('#filterText').textContent=el.textContent;$('#menu').classList.remove('open');document.querySelector('.filter').classList.remove('open');
 let b=$('#categoryFilterBtn');
 if(v){b.style.background=COLORS[v]+'22';b.style.color=COLORS[v];}else{b.style.background='#eee8f8';b.style.color='#75579b'}
 renderTasks()
}
function toggleMonthMenu(e){e.stopPropagation();document.querySelector('.monthPicker').classList.toggle('open');renderMonthMenu()}
function renderMonthMenu(){
 let months=['Thg 1','Thg 2','Thg 3','Thg 4','Thg 5','Thg 6','Thg 7','Thg 8','Thg 9','Thg 10','Thg 11','Thg 12'];
 $('#monthMenu').innerHTML=`<div class="monthMenuHead"><button type="button" onclick="event.stopPropagation();changeMonthYear(-1)">‹</button><strong>${monthMenuYear}</strong><button type="button" onclick="event.stopPropagation();changeMonthYear(1)">›</button></div><div class="monthGrid">${months.map((m,i)=>{let v=monthMenuYear+'-'+String(i+1).padStart(2,'0');return `<button type="button" class="${monthFilter===v?'selected':''}" onclick="event.stopPropagation();pickMonth('${v}','${m} ${monthMenuYear}')">${m}</button>`}).join('')}</div><button class="monthAll" type="button" onclick="event.stopPropagation();pickMonth('','Tất cả tháng')">Tất cả tháng</button>`
}
function changeMonthYear(n){monthMenuYear+=n;renderMonthMenu()}
function pickMonth(v,label){monthFilter=v;$('#monthFilterText').textContent=label;document.querySelector('.monthPicker').classList.remove('open');renderTasks()}
function chooseCat(el){selectedCat=el.dataset.cat;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('#saveBtn').style.background=COLORS[selectedCat]}
function setCat(c){selectedCat=c;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));$('#saveBtn').style.background=COLORS[c]}
function openModal(){editingId=null;selectedDate=TODAY;calendarCursor=new Date();$('#modalTitle').textContent='Thêm công việc';$('#saveBtn').textContent='Thêm task';$('#deleteBtn').style.display='none';$('#name').value='';$('#note').value='';$('#dateDisplay').textContent=dateLabel(TODAY);setCat('Edit Video');renderCalendar();$('#overlay').classList.add('show');setTimeout(()=>$('#name').focus(),180)}
function editTask(id){let t=tasks.find(x=>x.id===id);editingId=id;selectedDate=t.date;calendarCursor=new Date(t.date+'T00:00:00');$('#modalTitle').textContent='Chỉnh sửa công việc';$('#saveBtn').textContent='Lưu thay đổi';$('#deleteBtn').style.display='block';$('#name').value=t.name;$('#note').value=t.note||'';$('#dateDisplay').textContent=dateLabel(t.date);setCat(t.cat);renderCalendar();$('#overlay').classList.add('show')}
function closeModal(){$('#overlay').classList.remove('show');$('#calendarPopup').classList.remove('open')}
async function saveTask(){
 let name=$('#name').value.trim();if(!name)return $('#name').focus();
 setSaveState('● Saving...');
 const payload={name,task_date:selectedDate,category:selectedCat,note:$('#note').value.trim()};
 let res;
 if(editingId) res=await db.from('tasks').update(payload).eq('id',editingId).select().single();
 else res=await db.from('tasks').insert({...payload,done:false}).select().single();
 if(res.error){console.error(res.error);setSaveState('● Sync error');return}
 closeModal();await loadTasks()
}
async function deleteEditing(){
 if(editingId===null)return;
 setSaveState('● Saving...');
 const {error}=await db.from('tasks').delete().eq('id',editingId);
 if(error){console.error(error);setSaveState('● Sync error');return}
 closeModal();await loadTasks()
}
function toggleCalendar(e){e.stopPropagation();$('#calendarPopup').classList.toggle('open');renderCalendar()}function renderCalendar(){let y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),out='';$('#calMonth').textContent=new Intl.DateTimeFormat('vi-VN',{month:'long',year:'numeric'}).format(first);for(let i=start-1;i>=0;i--)out+=calBtn(new Date(y,m-1,prev-i),true);for(let d=1;d<=days;d++)out+=calBtn(new Date(y,m,d),false);let tail=(7-(start+days)%7)%7;for(let d=1;d<=tail;d++)out+=calBtn(new Date(y,m+1,d),true);$('#calDays').innerHTML=out}
function calBtn(d,dim){let k=iso(d);return `<button type="button" class="${dim?'dim ':''}${k===selectedDate?'selected ':''}${k===TODAY?'today':''}" onclick="pickDate('${k}')">${d.getDate()}</button>`}function pickDate(k){selectedDate=k;calendarCursor=new Date(k+'T00:00:00');$('#dateDisplay').textContent=dateLabel(k);$('#calendarPopup').classList.remove('open');renderCalendar()}function changeMonth(n){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+n,1);renderCalendar()}
document.addEventListener('click',e=>{if(!e.target.closest('.filter')){$('#menu').classList.remove('open');document.querySelector('.filter').classList.remove('open')}if(!e.target.closest('.monthPicker'))document.querySelector('.monthPicker').classList.remove('open');if(!e.target.closest('.datePicker'))$('#calendarPopup').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
let now=new Date();$('#dateText').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(now);$('#monthText').textContent=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(now);loadTasks();
</script></body></html>
