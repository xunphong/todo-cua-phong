[package]
name = "phong-work-desktop"
version = "0.1.0"
edition = "2021"
description = "PHONG WORK Windows focus companion"
[lib]
name = "phong_work_desktop_lib"
crate-type = ["staticlib","cdylib","rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
