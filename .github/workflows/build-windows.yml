name: Build PHONG WORK Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/phong-work-windows-desktop]
    paths: ['src-tauri/**','desktop/**','scripts/**','package.json','focus.js','reminders.js','index.html','.github/workflows/build-windows.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon desktop/icon.svg
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: PHONG-WORK-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
